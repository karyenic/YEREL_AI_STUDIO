<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK YEREL AI</title>
    <style>
        :root {
            --bg-body: #0f0f13;
            --text-body: #e0e0e0;
            --text-muted: #999;
            --bg-sidebar: #14141c;
            --border-color: #2a2a32;
            --bg-hist-item: #1e1e26;
            --bg-hist-active: #2b6e9e;
            --bg-input-field: #1e1e26;
            --border-input: #4a4a58; /* Daha belirgin çerçeve */
            --bg-topbar: #14141c;
            --bg-chatbox: #0f0f13;
            --bg-msg-user: #1e4a6b;
            --text-msg-user: #ffffff;
            --bg-msg-assistant: #25252e; /* Zemin daha belirgin ayrıştırıldı */
            --text-msg-assistant: #e0e0e0;
            --bg-msg-system: #4a2e2e;
            --text-msg-system: #ffb4a2;
            --bg-input-area: #15151b;
            --bg-prompt-field: #181820; /* Yazı alanı belirginleştirildi */
            --text-prompt-field: #ffffff;
            --bg-preview: #0c0c10;
        }
        body.light-theme {
            --bg-body: #f2f2f5;
            --text-body: #1a1a1e;
            --text-muted: #6b6b70;
            --bg-sidebar: #ffffff;
            --border-color: #dcdce0;
            --bg-hist-item: #f0f0f3;
            --bg-hist-active: #2b6e9e;
            --bg-input-field: #ffffff;
            --border-input: #b0b0ba;
            --bg-topbar: #ffffff;
            --bg-chatbox: #f2f2f5;
            --bg-msg-user: #2b6e9e;
            --text-msg-user: #ffffff;
            --bg-msg-assistant: #ffffff;
            --text-msg-assistant: #1a1a1e;
            --bg-msg-system: #ffe0d6;
            --text-msg-system: #8a3b28;
            --bg-input-area: #ffffff;
            --bg-prompt-field: #f0f0f4;
            --text-prompt-field: #1a1a1e;
            --bg-preview: #f7f7f9;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; font-size:1.05rem; }
        body { background:var(--bg-body); color:var(--text-body); height:100vh; overflow:hidden; transition: background 0.2s ease, color 0.2s ease; }

        #sidebar {
            width:300px;
            position:fixed; top:0; left:0; height:100vh; z-index:100;
            background:var(--bg-sidebar); border-right:1px solid var(--border-color);
            display:flex; flex-direction:column; padding:16px; overflow-y:auto;
            transition: transform 0.3s ease, background 0.2s ease;
            transform: translateX(0);
        }
        #sidebar.collapsed { transform: translateX(-100%); }
        #sidebar h2 { margin-bottom:12px; font-size:1.3rem; }
        #newChatBtn { padding:10px; background:#2b6e9e; border:none; border-radius:40px; color:white; font-weight:bold; cursor:pointer; margin-bottom:12px; font-size:1.05rem; }

        #sidebarModelLabel { font-size:0.85rem; color:var(--text-muted); margin-bottom:4px; }
        #modelSelect { width:100%; background:var(--bg-input-field); border:1px solid var(--border-input); color:var(--text-body); padding:8px 12px; border-radius:14px; font-size:0.95rem; margin-bottom:10px; }

        #downloadChatBtn { width:100%; background:#2e7d5e; border:none; border-radius:14px; color:white; padding:8px 12px; font-weight:bold; cursor:pointer; font-size:0.9rem; margin-bottom:16px; }

        #historyList { flex:1; overflow-y:auto; }
        .hist-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; margin:4px 0; background:var(--bg-hist-item); border-radius:12px; cursor:pointer; font-size:1rem; border:1px solid var(--border-color); }
        .hist-item.active { background:var(--bg-hist-active); }
        .hist-item.active, .hist-item.active .last-msg, .hist-item.active .model-name { color:#ffffff; }
        .hist-item .model-name { font-weight:bold; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
        .hist-item .type-tag { font-size:0.65rem; padding:1px 7px; border-radius:10px; font-weight:bold; }
        .type-tag.local { background:#1e4a3a; color:#7de3b3; }
        .type-tag.cloud { background:#3a2e5a; color:#c9a8ff; }
        .type-tag.research { background:#4a3416; color:#f0a868; }
        .type-tag.skill { background:#1e3a4a; color:#7ec8f0; }
        .hist-item .last-msg { font-size:0.8rem; color:var(--text-muted); margin-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:200px; }
        .hist-item .del { background:none; border:none; color:#ff8888; cursor:pointer; font-size:1rem; padding:0 4px; }

        #main { margin-left:300px; display:flex; flex-direction:column; height:100vh; transition: margin-left 0.3s ease; }
        #main.expanded { margin-left:0; }

        #topbar { padding:12px 20px; background:var(--bg-topbar); border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; transition: background 0.2s ease; }
        #topbar .chat-info { display:flex; align-items:center; gap:10px; font-size:1.1rem; }
        #sidebarToggle { background:var(--bg-input-field); border:1px solid var(--border-input); color:var(--text-body); width:38px; height:38px; border-radius:10px; cursor:pointer; font-size:1.2rem; flex-shrink:0; }
        
        #currentModelTag { font-size:0.85rem; padding:4px 12px; border-radius:20px; font-weight:bold; }
        .model-badge { font-size:0.85rem; padding:4px 12px; border-radius:20px; margin-bottom:6px; font-weight:bold; }
        
        #topbar .right-tools { display:flex; align-items:center; gap:8px; }
        #themeToggle { background:#5a4a2e; border:none; color:white; padding:6px 12px; border-radius:40px; cursor:pointer; font-size:1rem; }

        #statusBar { display:flex; gap:6px; }
        .status-pill { font-size:0.8rem; padding:4px 12px; border-radius:20px; font-weight:bold; display:inline-flex; align-items:center; gap:5px; }
        .status-pill::before { content:'●'; font-size:0.88rem; font-weight:500; }
        .status-pill.ok { background:#1e4a3a; color:#7de3b3; }
        .status-pill.ok::before { color:#34c77a; }
        .status-pill.down { background:#4a2e2e; color:#ffb4a2; }
        .status-pill.down::before { color:#ff6b6b; }

        #chatBox { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; background:var(--bg-chatbox); transition: background 0.2s ease; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .msg-wrapper { display:flex; flex-direction:column; max-width:80%; animation: fadeInUp 0.25s ease; }
        .msg-wrapper.user { align-self:flex-end; align-items:flex-end; }
        .msg-wrapper.assistant { align-self:flex-start; align-items:flex-start; }
        .msg-wrapper.system { align-self:center; align-items:center; max-width:90%; }
        .model-badge.local { background:#1e4a3a; color:#7de3b3; }
        .model-badge.cloud { background:#3a2e5a; color:#c9a8ff; }
        .model-badge.research { background:#4a3416; color:#f0a868; }
        .model-badge.skill { background:#1e3a4a; color:#7ec8f0; }
        .model-badge.user-badge { opacity:0.75; }
        
        .msg { padding:12px 18px; border-radius:20px; word-wrap:break-word; font-size:1rem; white-space:pre-wrap; border: 1px solid var(--border-input); }
        .user .msg { background:var(--bg-msg-user); color:var(--text-msg-user); border-color:#2b6e9e; }
        .assistant .msg { background:var(--bg-msg-assistant); color:var(--text-msg-assistant); }
        .system .msg { background:var(--bg-msg-system); color:var(--text-msg-system); font-size:0.9rem; text-align:center; }

        .chat-time { font-size: 0.88rem; font-weight: 500; color: var(--text-muted); margin-top: 4px; text-align: right; }

        /* KUM SAATİ ANİMASYONU VE YANIP SÖNME EFEKTİ */
        @keyframes spin-hourglass {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }
        .hourglass-icon {
            display: inline-block;
            animation: spin-hourglass 2s infinite ease-in-out;
            margin-right: 6px;
        }

        @keyframes msg-blink {
            0% { opacity: 1; }
            30% { opacity: 0.3; background-color: #2b6e9e; }
            60% { opacity: 1; }
            80% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .blink-effect {
            animation: msg-blink 0.8s ease-in-out 2;
        }

        #inputArea { padding:16px; background:var(--bg-input-area); border-top:1px solid var(--border-color); display:flex; flex-direction:column; gap:12px; transition: background 0.2s ease; }
        .input-row { display:flex; gap:12px; align-items:flex-end; }
        
        /* FERAH VE BELİRGİN SOHBET GİRİŞ KUTUSU */
        #prompt { 
            flex:1; 
            background:var(--bg-prompt-field); 
            border:2px solid var(--border-input); 
            border-radius:18px; 
            padding:14px; 
            color:var(--text-prompt-field); 
            resize:vertical; 
            font-size:1.1rem; 
            min-height: 140px; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        #prompt:focus { border-color: #2b6e9e; outline: none; }

        button { background:#2b6e9e; border:none; border-radius:40px; color:white; padding:0 20px; height:44px; cursor:pointer; font-weight:bold; font-size:1rem; }
        button:disabled { opacity:0.6; cursor:not-allowed; }
        .image-preview { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; background:var(--bg-preview); padding:8px; border-radius:16px; }
        .preview-item { position:relative; }
        .preview-item img { height:60px; border-radius:8px; }
        .remove-img { position:absolute; top:-8px; right:-8px; background:#8b5a2b; border-radius:50%; width:20px; height:20px; font-size:12px; padding:0; line-height:20px; text-align:center; cursor:pointer; }
        .tool-btn { background:#2e7d5e; }

        @media (max-width:700px) {
            #sidebar { width:270px; }
            #main { margin-left:0 !important; }
            .msg-wrapper { max-width:95%; }
        }
    
/* Loş (Ara) Tema Stilleri */
body.dim-theme {
            --bg-body: #22272e;
            --text-body: #adbac7;
            --text-muted: #768390;
            --bg-sidebar: #1c2128;
            --border-color: #373e47;
            --bg-hist-item: #2d333b;
            --bg-hist-active: #2b6e9e;
            --bg-input-field: #2d333b;
            --border-input: #444c56;
            --bg-topbar: #1c2128;
            --bg-chatbox: #22272e;
            --bg-msg-user: #1f4e7d;
            --text-msg-user: #ffffff;
            --bg-msg-assistant: #2d333b;
            --text-msg-assistant: #adbac7;
            --bg-msg-system: #442d2d;
            --text-msg-system: #f5a996;
            --bg-input-area: #1c2128;
            --bg-prompt-field: #22272e;
            --text-prompt-field: #adbac7;
            --bg-preview: #22272e;
        }
body.dim-theme .sidebar, body.dim-theme #sidebar {
    background-color: #0f172a !important;
}
body.dim-theme .chat-container, body.dim-theme .main-content, body.dim-theme main {
    background-color: #1e293b !important;
}
body.dim-theme .chat-bubble, body.dim-theme .message-bubble {
    border-color: #475569 !important;
}


/* Mini Kopyala ve İndir Buton Stilleri */
.msg-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    justify-content: flex-end;
}
.msg-action-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e2e8f0;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
}
.msg-action-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    color: #ffffff;
}


/* Durdur Butonu Stili */
.btn-stop {
    background-color: #ef4444 !important;
    color: #ffffff !important;
    border-color: #dc2626 !important;
}
.btn-stop:hover {
    background-color: #dc2626 !important;
}


/* Sol Menü Blink Efekti */
@keyframes histBlink {
  0% { opacity: 1; background-color: rgba(59, 130, 246, 0.4); }
  50% { opacity: 0.3; background-color: rgba(59, 130, 246, 0.8); }
  100% { opacity: 1; background-color: transparent; }
}
.hist-blink {
  animation: histBlink 0.6s ease-in-out 3 !important;
}


/* V5 Yanıt Bildirim Animasyonu */
@keyframes newReplyPulse {
    0%, 100% { background: var(--bg-hist-item, #1e1e26); box-shadow: none; }
    50% { background: #1c3d2a; box-shadow: 0 0 0 2px rgba(52, 199, 122, 0.35); }
}
.hist-item.new-reply, .chat-history-item.new-reply {
    animation: newReplyPulse 1.1s ease-in-out 3;
}


/* Sadece Sol Liste Aktif Kart İkazı */
#historyList .hist-item.active.sidebar-flash {
    animation: sidebarFlashAnim 0.6s ease-in-out 2 !important;
}
@keyframes sidebarFlashAnim {
    0%, 100% { background-color: var(--bg-hist-active, #2b6e9e); }
    50% { background-color: #10b981; }
}

</style>
</head>
<body>
<div id="sidebar">
    <h2>💬 Sohbetler</h2>
    <button id="newChatBtn">+ Yeni Sohbet</button>
    <div id="sidebarModelLabel"><span style="color:#ffffff !important; font-weight:700 !important; font-size:0.95rem !important;">Model seç</span></div>
    <select id="modelSelect"></select>
    <button id="downloadChatBtn">💾 Sohbeti İndir (.txt)</button>
    <div id="historyList"></div>
</div>
<div id="main">
    <div id="topbar">
        <div class="chat-info">
            <button id="sidebarToggle">☰</button>
            <span id="chatTitle">Sohbet</span>
            <span id="currentModelTag"></span>
        </div>
        <div class="right-tools">
            <div id="statusBar" class="status-bar"></div>
            <button id="themeToggle">🌓 Tema</button>
            <button id="shutdownBtn" style="background:#c0392b; color:white; border:none; border-radius:4px; padding:6px 12px; cursor:pointer;">⏻ Çıkış</button>
        </div>
    </div>
    <div id="chatBox">
        <div class="msg-wrapper system"><div class="msg">Sistem: Hoş geldiniz! Sol menüden bir model/sohbet seçin veya yeni sohbet başlatın.</div></div>
    </div>
    <div id="inputArea">
        <div style="display: flex; gap: 10px; margin-bottom: 4px; align-items: center; padding: 6px; background: var(--bg-input-field); border-radius: 8px; border: 1px solid var(--border-input);">
            <input type="file" id="txtFileInput" accept=".txt" style="flex: 1; padding: 4px; border: 1px solid var(--border-input); border-radius: 4px; background: var(--bg-prompt-field); color: var(--text-body);">
            <button id="sendTxtBtn" style="padding: 6px 16px; height:36px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; white-space: nowrap;">
                📄 TXT Gönder
            </button>
        </div>
        <div class="input-row">
            <textarea id="prompt" placeholder="Mesaj yaz... (Enter gönder, Shift+Enter satır atlar, Ctrl+V resim yapıştır)"></textarea>
            <button id="sendBtn">Gönder</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
            <button id="selectImageBtn">📷 Görsel Seç</button>
            <button id="excelBtn" class="tool-btn">📊 Excel Yap</button>
            <button id="pdfBtn" class="tool-btn">📄 PDF Yükle</button>
        </div>
        <div id="imagePreviewContainer" class="image-preview" style="display:none;"></div>
        <input type="file" id="pdfInput" accept=".pdf" style="display:none">
    </div>
</div>

<script>
(function(){
    'use strict';
    let currentAbortController = null;
    let currentImages = [], conversations = {}, currentConvId = null, nextId = 1, dark = true, sidebarOpen = true, toolBusy = false;

    const chatBox = document.getElementById('chatBox'), promptEl = document.getElementById('prompt'), sendBtn = document.getElementById('sendBtn');
    const modelSelect = document.getElementById('modelSelect'), historyList = document.getElementById('historyList'), newChatBtn = document.getElementById('newChatBtn');
    const themeToggle = document.getElementById('themeToggle');
    const imageInput = document.getElementById('imageInput'), selectImageBtn = document.getElementById('selectImageBtn');
    const excelBtn = document.getElementById('excelBtn'), pdfBtn = document.getElementById('pdfBtn'), pdfInput = document.getElementById('pdfInput');
    const previewContainer = document.getElementById('imagePreviewContainer'), chatTitle = document.getElementById('chatTitle');
    const sidebar = document.getElementById('sidebar'), mainEl = document.getElementById('main'), sidebarToggle = document.getElementById('sidebarToggle');
    const currentModelTag = document.getElementById('currentModelTag');
    const statusBar = document.getElementById('statusBar');
    const downloadChatBtn = document.getElementById('downloadChatBtn');

    function getFormattedTimestamp() {
        const now = new Date();
        const gun = String(now.getDate()).padStart(2, '0');
        const ay = String(now.getMonth() + 1).padStart(2, '0');
        const yil = now.getFullYear();
        const saat = String(now.getHours()).padStart(2, '0');
        const dakika = String(now.getMinutes()).padStart(2, '0');
        return `${gun}.${ay}.${yil} ${saat}:${dakika}`;
    }

    function modelKind(model) {
        if (model && model.startsWith('skill:')) return 'skill';
        if (model && model.startsWith('gemini')) return 'cloud';
        return 'local';
    }
    function modelIcon(kind) {
        if (kind === 'skill') return '🛠️';
        return kind === 'research' ? '🔎' : (kind === 'cloud' ? '☁️' : '🖥️');
    }
    function modelDisplayName(model) {
        if (model === 'gemini-2.5-flash') return 'Gemini 2.5 Flash';
        if (model && model.startsWith('skill:')) {
            const info = skillInfo[model];
            return info ? info.name : model.slice('skill:'.length);
        }
        return model;
    }

    function setSidebarOpen(open) {
        sidebarOpen = open;
        sidebar.classList.toggle('collapsed', !open);
        mainEl.classList.toggle('expanded', !open);
    }
    sidebarToggle.onclick = () => setSidebarOpen(!sidebarOpen);
    if (window.innerWidth <= 700) setSidebarOpen(false);

    async function updateStatus() {
        try {
            const res = await fetch('/status');
            const data = await res.json();
            renderStatus(data);
        } catch (e) {
            renderStatus({ ollama: false, gemini: false });
        }
    }

    function renderStatus(data) {
        statusBar.innerHTML = '';
        const ollamaPill = document.createElement('span');
        ollamaPill.className = 'status-pill ' + (data.ollama ? 'ok' : 'down');
        ollamaPill.textContent = '🖥️ Ollama';
        statusBar.appendChild(ollamaPill);

        const usage = data.cloud_usage_today || {};
        const geminiPill = document.createElement('span');
        geminiPill.className = 'status-pill ' + (data.gemini ? 'ok' : 'down');
        const geminiCount = usage['gemini-2.5-flash'] || 0;
        geminiPill.textContent = '☁️ Gemini' + (geminiCount ? ' (' + geminiCount + ')' : '');
        statusBar.appendChild(geminiPill);
    }

    updateStatus();
    setInterval(updateStatus, 15000);

    function warmupModel(model) {
        if (!model || modelKind(model) !== 'local') return;
        fetch('/warmup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model })
        }).catch(() => {});
    }

    function generateTitle(messages) {
        const first = messages.find(m => m.role === 'user');
        if (first && first.content) {
            let t = first.content;
            if (t.length > 30) t = t.substring(0, 30) + '…';
            return t;
        }
        return 'Yeni Sohbet';
    }

    function save() {
        localStorage.setItem('convs', JSON.stringify(conversations));
        localStorage.setItem('currentId', currentConvId);
        localStorage.setItem('nextId', nextId);
        fetch('/save-conversations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversations, currentConvId, nextId })
        }).catch(() => {});
    }

    async function loadConversations() {
        const saved = localStorage.getItem('convs');
        if (saved) {
            conversations = JSON.parse(saved);
            currentConvId = localStorage.getItem('currentId');
            nextId = parseInt(localStorage.getItem('nextId')) || 1;
            if (!currentConvId || !conversations[currentConvId]) {
                const ids = Object.keys(conversations);
                currentConvId = ids.length ? ids[0] : null;
                if (!currentConvId) createNewChat();
            }
        } else {
            let restored = false;
            try {
                const res = await fetch('/load-conversations');
                const data = await res.json();
                if (data.found && data.data && data.data.conversations) {
                    conversations = data.data.conversations;
                    currentConvId = data.data.currentConvId;
                    nextId = data.data.nextId || 1;
                    restored = true;
                }
            } catch (e) {}
            if (!restored) createNewChat();
        }
        renderHistory();
        renderChat();
        updateSendButtonState();
    }

    function findConvByModel(model) {
        for (let id in conversations) {
            if (conversations[id].model === model) return id;
        }
        return null;
    }

    function openConversation(id) {
        currentConvId = id;
        if (conversations[id]) conversations[id].hasNewReply = false;
        save();
        renderHistory();
        renderChat();
        updateSendButtonState();
        if (conversations[id]) warmupModel(conversations[id].model);
        if (window.innerWidth <= 700) setSidebarOpen(false);
    }

    function isVisionOnlyModel(model) {
        if (!model) return false;
        const m = model.toLowerCase();
        return (m.includes('moondream') || m.includes('vision') || m.includes('granite')) && modelKind(m) === 'local';
    }

    function createNewChat() {
        const model = modelSelect.value || 'qwen2.5:7b';
        const existingId = findConvByModel(model);
        if (existingId) {
            openConversation(existingId);
            modelSelect.value = model;
            return;
        }
        const id = String(nextId++);
        const initialMessages = [{ role: 'system', content: 'Sistem: Yeni sohbet (' + modelDisplayName(model) + ') başladı.', timestamp: getFormattedTimestamp() }];
        if (isVisionOnlyModel(model)) {
            initialMessages.push({
                role: 'system',
                content: 'ℹ️ Bu model görsel (resim) analizi için optimize edilmiştir. Görsel eklemeden sorduğunuz genel sohbet sorularında yanıtları zayıf/tutarsız olabilir.',
                timestamp: getFormattedTimestamp()
            });
        }
        conversations[id] = {

        };
        openConversation(id);

    function deleteChat(id) {
        if (id === currentConvId) {
            const ids = Object.keys(conversations).filter(i => i !== id);
            currentConvId = ids.length ? ids[0] : null;
        }
        delete conversations[id];
        save();
        if (!currentConvId) createNewChat();
        renderHistory();
        renderChat();
        updateSendButtonState();
    }

    function renderHistory() {
        historyList.innerHTML = '';
        const modelMap = {};
        const ids = Object.keys(conversations);
        for (let id of ids) {
            const conv = conversations[id];
            const model = conv.model || 'bilinmiyor';
            const lastMsg = conv.messages[conv.messages.length - 1]?.content || '';
            modelMap[model] = { id, lastMsg };
        }
        const sortedModels = Object.keys(modelMap).sort();
        for (let model of sortedModels) {
            const { id, lastMsg } = modelMap[model];
            const conv = conversations[id];
            const kind = modelKind(model);
            const div = document.createElement('div');
            div.className = 'hist-item'
                + (id === currentConvId ? ' active' : '')
                + (conv.pending ? ' pending' : '')
                + (conv.hasNewReply ? ' new-reply' : '');

            const infoDiv = document.createElement('div');
            infoDiv.style.display = 'flex';
            infoDiv.style.flexDirection = 'column';
            infoDiv.style.flex = '1';

            const titleSpan = document.createElement('span');
            titleSpan.className = 'model-name';
            const tag = document.createElement('span');
            tag.className = 'type-tag ' + kind;
            tag.textContent = kind === 'skill' ? 'SKILL' : (kind === 'research' ? 'ARAŞTIRMA' : (kind === 'cloud' ? 'BULUT' : 'YEREL'));
            
            // Eğer yanıt bekleniyorsa kum saati göster
            const statusIcon = conv.pending ? '⏳ ' : '';
            titleSpan.appendChild(document.createTextNode(statusIcon + modelDisplayName(model) + ' '));
            titleSpan.appendChild(tag);

            const msgSpan = document.createElement('span');
            msgSpan.className = 'last-msg';
            let snippet = lastMsg;
            if (snippet.length > 30) snippet = snippet.substring(0, 30) + '…';
            msgSpan.textContent = snippet;

            infoDiv.appendChild(titleSpan);
            infoDiv.appendChild(msgSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'del';
            delBtn.textContent = '🗑️';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (confirm('Bu sohbet silinsin mi?')) deleteChat(id);
            };

            div.appendChild(infoDiv);
            div.appendChild(delBtn);
            div.onclick = () => {
                openConversation(id);
                modelSelect.value = model;
            };
            historyList.appendChild(div);
        }
    }

                div.classList.add('blink-effect');
                setTimeout(() => { conv.isJustFinished = false; }, 2000);
            }

            if (msg.chart_url) {
                div.innerHTML = `${msg.content}<br><br><img src="${msg.chart_url}" style="max-width:100%; border-radius:12px; margin-top:10px; border:1px solid var(--border-color);">`;

    function addMessageTo(convId, role, content, model, fallback, requestedModel, displayLabel, chartUrl = null) {
        const conv = conversations[convId];
        if (!conv) return;
        const entry = { role, content, timestamp: getFormattedTimestamp() };
        if (displayLabel) entry.displayLabel = displayLabel;
        if (chartUrl) entry.chart_url = chartUrl;
        if (role !== 'system') entry.model = model || conv.model;
        if (fallback) {
            entry.fallback = true;
            entry.requestedModel = requestedModel;
        }
        conv.messages.push(entry);
        if (role === 'user' && conv.messages.filter(m => m.role === 'user').length === 1) {
            const newTitle = generateTitle(conv.messages);
            if (newTitle !== 'Yeni Sohbet') conv.title = newTitle;
        }
        save();
        if (convId === currentConvId) renderChat();
        renderHistory();
    }

    async function sendMessage(displayLabel) {
        const convId = currentConvId;
        if (!convId) return;
        const conv = conversations[convId];
        if (!conv || conv.pending) return;

        const prompt = promptEl.value.trim();
        if (!prompt && currentImages.length === 0) return;

        const imagesToSend = currentImages.slice();
        let userMsg = prompt || ('Görsel' + (imagesToSend.length > 1 ? 'ler' : '') + ' hakkında yorum yap');

        const history = buildHistoryForModel(conv);

        addMessageTo(
            convId, 'user',
            userMsg + (imagesToSend.length ? ' [' + imagesToSend.length + ' görsel]' : ''),
            null, false, null,
            displayLabel || null
        );
        promptEl.value = '';

        if (imagesToSend.length) {
            currentImages = [];
            previewContainer.innerHTML = '';
            previewContainer.style.display = 'none';
        }

        conv.pending = true;
        currentAbortController = new AbortController();
        conv.streamingText = '';
        conv.streamingModel = conv.model;
        save();
        renderHistory();
        if (convId === currentConvId) { renderChat(); updateSendButtonState(); }
        // Yanıt bittiğinde sadece sol listedeki aktif kartı parlatır
        const activeSidebarItem = document.querySelector('#historyList .hist-item.active');
        if (activeSidebarItem) {
            activeSidebarItem.classList.remove('sidebar-flash');
            void activeSidebarItem.offsetWidth;
            activeSidebarItem.classList.add('sidebar-flash');
            setTimeout(() => activeSidebarItem.classList.remove('sidebar-flash'), 1200);
        }


        const model = conv.model;
        const hasImages = imagesToSend.length > 0;
        const url = hasImages ? '/chat-multi-image' : '/chat';
        const body = hasImages
            ? { prompt: userMsg, model, images: imagesToSend, history }
            : { prompt: userMsg, model, history };

        let finalModel = model;
        let finalFallback = false;
        let finalRequestedModel = null;
        let accumulated = '';
        let streamError = null;

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: currentAbortController.signal
            });

            if (!res.ok || !res.body) {
                throw new Error('Sunucudan yanıt alınamadı (' + res.status + ')');
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (!line.trim()) continue;
                    let evt;
                    try { evt = JSON.parse(line); } catch (e) { continue; }

                    if (evt.type === 'meta') {
                        finalModel = evt.model;
                        finalFallback = !!evt.fallback;
                        finalRequestedModel = evt.requested_model || null;
                        conv.streamingModel = finalModel;
                    } else if (evt.type === 'chunk') {
                        accumulated += evt.text;
                        conv.streamingText = accumulated;
                        if (convId === currentConvId) updateStreamingBubble(conv);
                    } else if (evt.type === 'error') {
                        streamError = evt.message;
                    }
                }
            }

            if (streamError && !accumulated) {
                throw new Error(streamError);
            }

            conv.isJustFinished = true; // Yanıt tamamlandı, efekti tetikle
            addMessageTo(convId, 'assistant', accumulated, finalModel, finalFallback, finalRequestedModel);
        } catch (e) {
            addMessageTo(convId, 'system', 'Hata: ' + e.message);
        } finally {
            conv.pending = false;
            conv.streamingText = '';
            conv.streamingModel = null;
            if (convId !== currentConvId) conv.hasNewReply = true;
            save();
            renderHistory();
            if (convId === currentConvId) { renderChat(); updateSendButtonState(); }
        // Yanıt bittiğinde sadece sol listedeki aktif kartı parlatır
        const activeSidebarItem = document.querySelector('#historyList .hist-item.active');
        if (activeSidebarItem) {
            activeSidebarItem.classList.remove('sidebar-flash');
            void activeSidebarItem.offsetWidth;
            activeSidebarItem.classList.add('sidebar-flash');
            setTimeout(() => activeSidebarItem.classList.remove('sidebar-flash'), 1200);
        }

        }
    }

                model: model,
                pending: false,
                hasNewReply: false,
                messages: [{ role: 'system', content: 'Sistem: Yeni sohbet (' + modelDisplayName(model) + ') başladı.', timestamp: getFormattedTimestamp() }]
            };
            openConversation(id);
        }
    };

    (async function init() {
        await loadModels();
        loadConversations();
        if (!currentConvId || !conversations[currentConvId]) {
            createNewChat();
        }
    })();
})();

document.getElementById('shutdownBtn').addEventListener('click', async () => {
    if (!confirm('Uygulamayı kapatmak istediğine emin misin? Ollama da birlikte kapanacak.')) {
        return;
    }
    try {
        await fetch('/shutdown', { method: 'POST' });
    } catch (e) {}
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;font-size:18px;">✅ Uygulama ve Ollama kapatıldı. Bu sekmeyi kapatabilirsin.</div>';
    setTimeout(() => { window.close(); }, 800);
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const themeBtn = document.getElementById('theme-btn') || document.querySelector('[onclick*="toggleTheme"]');
    if (themeBtn) {
        themeBtn.removeAttribute('onclick');
        themeBtn.addEventListener('click', function() {
            const body = document.body;
            if (!body.classList.contains('dim-theme') && !body.classList.contains('light-theme')) {
                // Koyu -> Loş
                body.classList.add('dim-theme');
                themeBtn.innerHTML = '🌗 Tema (Loş)';
            } else if (body.classList.contains('dim-theme')) {
                // Loş -> Açık
                body.classList.remove('dim-theme');
                body.classList.add('light-theme');
                themeBtn.innerHTML = '☀️ Tema (Açık)';
            } else {
                // Açık -> Koyu
                body.classList.remove('light-theme');
                themeBtn.innerHTML = '🌙 Tema (Koyu)';
            }
        });
    }
});
</script>


<script>
function copyMsgText(btn) {
    const msgContainer = btn.closest('.message-bubble') || btn.closest('.chat-bubble') || btn.parentElement.parentElement;
    if (!msgContainer) return;
    
    // Buton metinlerini ve tarihleri süzerek temiz metni al
    const clone = msgContainer.cloneNode(true);
    const actions = clone.querySelector('.msg-actions');
    if (actions) actions.remove();
    
    const textToCopy = clone.innerText.trim();
    navigator.clipboard.writeText(textToCopy).then(() => {
        const orig = btn.innerText;
        btn.innerText = "✓ Kopyalandı";
        setTimeout(() => btn.innerText = orig, 1500);
    });
}

function downloadMsgText(btn) {
    const msgContainer = btn.closest('.message-bubble') || btn.closest('.chat-bubble') || btn.parentElement.parentElement;
    if (!msgContainer) return;
    
    const clone = msgContainer.cloneNode(true);
    const actions = clone.querySelector('.msg-actions');
    if (actions) actions.remove();
    
    const textToDownload = clone.innerText.trim();
    const blob = new Blob([textToDownload], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `yanit_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
}
</script>


<script>
function attachMiniButtons() {
    // Model/Asistan yanıt balonlarını hedefler
    const botBubbles = document.querySelectorAll('.bot, .assistant, [data-role="assistant"], .message-bubble:not(.user)');
    botBubbles.forEach(bubble => {
        if (!bubble.querySelector('.msg-actions') && bubble.innerText.trim().length > 0) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'msg-actions';
            actionsDiv.innerHTML = `
                <button class="msg-action-btn" onclick="copyMsgText(this)">📋 Kopyala</button>
                <button class="msg-action-btn" onclick="downloadMsgText(this)">💾 İndir (.txt)</button>
            `;
            bubble.appendChild(actionsDiv);
        }
    });
}

// Balonlar oluştukça butonları otomatik bağla
setInterval(attachMiniButtons, 1000);
</script>


<script>
let globalAbortController = null;

function setGeneratingState(isGenerating) {
    const sendBtn = document.getElementById('send-btn') || document.querySelector('button[onclick*="send"]');
    if (!sendBtn) return;

    if (isGenerating) {
        sendBtn.dataset.origText = sendBtn.innerHTML;
        sendBtn.innerHTML = "🔴 Durdur";
        sendBtn.classList.add('btn-stop');
        sendBtn.onclick = function(e) {
            e.preventDefault();
            if (globalAbortController) {
                globalAbortController.abort();
                globalAbortController = null;
            }
            setGeneratingState(false);
        };
    } else {
        sendBtn.innerHTML = sendBtn.dataset.origText || "Gönder";
        sendBtn.classList.remove('btn-stop');
        sendBtn.onclick = null; // Varsayılan form/click fonksiyonuna döner
    }
}
</script>


<script>
document.addEventListener("DOMContentLoaded", function() {
    const fileInput = document.querySelector('input[type="file"]') || document.getElementById('file-input');
    const textarea = document.querySelector('textarea');

    if (fileInput && textarea) {
        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const contentText = evt.target.result;
                    const formattedPacket = `\n\n--- DOSYA BAŞLANGICI: ${file.name} ---\n${contentText}\n--- DOSYA BİTİŞİ: ${file.name} ---\n`;
                    
                    textarea.value += formattedPacket;
                    textarea.dispatchEvent(new Event('input', { bubbles: true }));
                };
                reader.readAsText(file);
            });
        });
    }
});
</script>


<script>
function triggerSidebarBlink() {
    const sidebar = document.querySelector('.sidebar') || document.querySelector('#sidebar') || document.querySelector('aside') || document.querySelector('.left-panel');
    if (!sidebar) return;
    
    const activeChat = sidebar.querySelector('.active');
    if (activeChat) {
        activeChat.classList.remove('hist-blink');
        void activeChat.offsetWidth; // Reflow tetikleme
        activeChat.classList.add('hist-blink');
    }
}
}

// Model yanıt üretmeyi bitirdiğinde otomatik blink tetikler
let wasStreaming = false;
setInterval(() => {
    const isStreaming = document.querySelector('.streaming, .typing, .loading');
    if (isStreaming) {
        wasStreaming = true;
    } else if (wasStreaming) {
        wasStreaming = false;
        triggerSidebarBlink();
    }
}, 500);
</script>
